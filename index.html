        // ================= قالب رسالة الواتساب للعملاء المطابقين للشروط =================
        function getEligibleWhatsAppLink(projectName, govName, bracket, status, income) {
            const modeText = currentMode === 'immediate' ? 'الاستلام الفوري' : 'استلام خلال 36 شهر';
            const msg = `أهلاً شركة مسارك إلي الإسكان، أرغب في التقديم وهذه بياناتي:
- النظام المطلوب: ${modeText} (${projectName} - شريحة ${bracket})
- محافظة محل الإقامة: ${govName}
- السن: 
- إجمالي الدخل الشهري: ${formatNumber(income)} ج.م
- الحالة الاجتماعية: ${status}`;
            return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
        }

        // ================= دوال التحكم في الواجهة =================
        function selectMode(mode) {
            currentMode = mode;
            document.getElementById('landingPage').classList.add('hidden');
            document.getElementById('appPage').classList.remove('hidden');
            
            const badge = document.getElementById('modeBadge');
            document.getElementById('resultArea').classList.add('hidden'); 
            
            if (mode === 'immediate') {
                badge.innerText = 'نظام الاستلام الفوري';
                badge.className = 'font-bold px-4 py-1.5 rounded-full text-sm inline-block shadow-sm bg-blue-100 brand-blue';
            } else {
                badge.innerText = 'نظام الاستلام خلال 36 شهر';
                badge.className = 'font-bold px-4 py-1.5 rounded-full text-sm inline-block shadow-sm bg-orange-100 brand-orange';
            }
        }

        function goBack() {
            document.getElementById('appPage').classList.add('hidden');
            document.getElementById('landingPage').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            currentMode = '';
        }

        function formatNumber(num) {
            if (!num && num !== 0) return "-";
            return Number(num).toLocaleString('ar-EG', {maximumFractionDigits: 0});
        }

        function formatRange(min, max) {
            if (!min && !max) return "-";
            return (min === max) ? formatNumber(min) : `${formatNumber(min)} - ${formatNumber(max)}`;
        }

        function normalizeArabic(text) {
            if (!text) return "";
            return text.toString().replace(/[أإآا]/g, 'ا').replace(/ة/g, 'ه').trim();
        }

        // ================= دالة البحث الرئيسية =================
        function searchUnits() {
            const gov = document.getElementById("gov").value;
            const status = document.getElementById("status").value;
            const income = parseInt(document.getElementById("income").value);
            
            let bracket = null;

            if (status === "أعزب") {
                if (income >= 5000 && income <= 12000) bracket = 1;
                else if (income >= 12001 && income <= 21000) bracket = 2;
                else if (income >= 21001 && income <= 33000) bracket = 3;
            } else {
                if (income >= 5000 && income <= 16000) bracket = 1;
                else if (income >= 16001 && income <= 28000) bracket = 2;
                else if (income >= 28001 && income <= 44000) bracket = 3;
            }

            const resultArea = document.getElementById("resultArea");
            const alertBox = document.getElementById("alertBox");
            const cardsContainer = document.getElementById("cardsContainer");

            resultArea.classList.remove("hidden");
            cardsContainer.innerHTML = "";

            if (bracket === null) {
                // رسالة عدم التطابق الجديدة والمحسنة ديناميكياً
                const waLink = getIneligibleWhatsAppLink(gov, status, income);
                alertBox.className = "p-5 rounded-2xl mb-6 text-center bg-orange-50 border border-orange-200 shadow-sm";
                alertBox.innerHTML = `
                    <div class="font-bold text-xl brand-orange mb-2">عفواً، شروط هذا الطرح قد لا تتطابق مع بياناتك الحالية!</div>
                    <div class="text-gray-600 mb-4 font-medium">لكن الفرص مستمرة.. لدينا بدائل أخرى ممتازة ضمن مشاريع الإسكان الحكومي تناسب فئتك وميزانيتك.</div>
                    <a href="${waLink}" target="_blank" class="inline-block bg-green-500 hover:bg-green-600 text-white font-bold py-2.5 px-6 rounded-xl transition shadow-md">
                        تواصل معنا لاكتشاف البدائل الحكومية
                    </a>
                `;
                return;
            }

            const activeData = (currentMode === 'immediate') ? immediateData : futureData;
            const normalizedGov = normalizeArabic(gov);
            
            const filtered = activeData.filter(item => {
                const availableGovs = item["المحافظات المتاح لها التقديم "] || "";
                const normalizedTarget = normalizeArabic(availableGovs);
                return item["الشريحه"] == bracket && normalizedTarget.includes(normalizedGov);
            });

            if (filtered.length === 0) {
                alertBox.className = "p-5 rounded-2xl mb-6 font-bold text-center bg-yellow-50 text-yellow-800 border border-yellow-200 shadow-sm";
                alertBox.innerHTML = `⚠️ أنت ضمن شريحة (${bracket}) ولكن لا يوجد مشاريع متاحة حالياً لمحافظتك في هذا النظام.`;
            } else {
                alertBox.className = "p-5 rounded-2xl mb-6 font-bold text-center bg-green-50 text-green-800 border border-green-200 shadow-sm";
                alertBox.innerHTML = `🎉 ممتاز! أنت مستوفي لشروط التقديم في شريحة (${bracket}) ووجدنا <strong>${filtered.length}</strong> مشروع متاح لك.`;
                
                if (currentMode === 'immediate') {
                    renderImmediateCards(filtered, bracket, status, income, cardsContainer);
                } else {
                    renderFutureCards(filtered, bracket, status, income, cardsContainer);
                }
            }
        }

        function getIncomeDetails(bracket, status) {
            if (bracket == 1) return status === "أعزب" ? "من 5,000 إلى 12,000 ج.م" : "من 5,000 إلى 16,000 ج.م";
            if (bracket == 2) return status === "أعزب" ? "من 12,001 إلى 21,000 ج.م" : "من 16,001 إلى 28,000 ج.م";
            if (bracket == 3) return status === "أعزب" ? "من 21,001 إلى 33,000 ج.م" : "من 28,001 إلى 44,000 ج.م";
            return "";
        }

        function renderImmediateCards(filtered, bracket, status, income, container) {
            filtered.forEach(item => {
                const totalCells = item["Total cells"] || "-";
                let incomeDetails = getIncomeDetails(bracket, status);
                const statusLabel = status === "أعزب" ? "الأعزب" : "الأسرة";
                const waLink = getEligibleWhatsAppLink(item["المشروع"], item["المحافظة"], bracket, status, income);

                const card = `
                <div class="bg-white rounded-2xl shadow-md border-t-4 border-brand-blue overflow-hidden hover:shadow-xl transition flex flex-col">
                    <div class="p-5 flex justify-between items-center border-b border-gray-100 bg-gray-50">
                        <div>
                            <h3 class="font-black text-2xl brand-blue">${item["المحافظة"]}</h3>
                            <p class="text-gray-500 text-sm mt-1 font-bold">مدينة: ${item["المدينة"]}</p>
                        </div>
                        <span class="bg-brand-orange text-white text-sm font-bold px-4 py-1.5 rounded-full shadow-sm">${item["المشروع"]}</span>
                    </div>
                    <div class="bg-gray-50 border-b border-gray-100 p-3 text-center">
                        <p class="text-gray-800 text-xs md:text-sm font-bold">💡 مقتصر على الشريحة (${item["الشريحه"]})</p>
                        <p class="text-gray-500 text-xs font-medium mt-1">(${statusLabel}: ${incomeDetails})</p>
                    </div>
                    <div class="p-6 space-y-4 flex-grow">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                            <span class="text-gray-500 font-bold">الوحدات المتاحة</span>
                            <div class="text-left">
                                <div class="font-black text-xl brand-blue" dir="ltr">${formatNumber(totalCells)} <span class="text-xs text-gray-500">وحدة</span></div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                            <span class="text-gray-500 font-bold">المساحة (م²)</span>
                            <span class="font-black text-gray-800 text-lg" dir="ltr">${formatRange(item["أقل مساحة"], item["أكبر مساحة"])}</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                            <span class="text-gray-500 font-bold">مبلغ التأمين</span>
                            <span class="font-black text-gray-800 text-lg" dir="ltr">${formatRange(item["أقل تأمين"], item["أكبر تأمين"])} <span class="text-xs font-medium">ج.م</span></span>
                        </div>
                        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                            <span class="text-gray-500 font-bold">الإيجار الشهري</span>
                            <span class="font-black text-green-600 text-xl" dir="ltr">${formatRange(item["أقل ايجار"], item["أكبر ايجار"])} <span class="text-xs font-medium">ج.م</span></span>
                        </div>
                        <div class="flex justify-between items-center pb-2">
                            <span class="text-gray-500 font-bold text-lg">جدية الحجز</span>
                            <span class="font-black text-red-600 text-xl" dir="ltr">${formatNumber(item["جديه الحجز"])} <span class="text-xs font-bold">ج.م</span></span>
                        </div>
                    </div>
                    <!-- زر الواتساب (CTA) -->
                    <div class="p-5 border-t border-gray-100 bg-white">
                        <a href="${waLink}" target="_blank" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl flex justify-center items-center gap-2 transition shadow-md">
                            تواصل معنا لتجهيز أوراق التقديم
                        </a>
                    </div>
                </div>`;
                container.innerHTML += card;
            });
        }

        function renderFutureCards(filtered, bracket, status, income, container) {
            filtered.forEach(item => {
                const totalCells = item["Total cells"] || "-";
                let incomeDetails = getIncomeDetails(bracket, status);
                const statusLabel = status === "أعزب" ? "الأعزب" : "الأسرة";
                const waLink = getEligibleWhatsAppLink(item["المشروع"], item["المحافظة"], bracket, status, income);

                const card = `
                <div class="bg-white rounded-2xl shadow-md border-t-4 border-brand-orange overflow-hidden hover:shadow-xl transition flex flex-col">
                    <div class="p-5 flex justify-between items-center border-b border-gray-100 bg-gray-50">
                        <div>
                            <h3 class="font-black text-2xl brand-blue">${item["المحافظة"]}</h3>
                            <p class="text-gray-500 text-sm mt-1 font-bold">مدينة: ${item["المدينة"]}</p>
                        </div>
                        <span class="bg-brand-blue text-white text-sm font-bold px-4 py-1.5 rounded-full shadow-sm">${item["المشروع"]}</span>
                    </div>
                    <div class="bg-gray-50 border-b border-gray-100 p-3 text-center">
                        <p class="text-gray-800 text-xs md:text-sm font-bold">💡 مقتصر على الشريحة (${item["الشريحه"]})</p>
                        <p class="text-gray-500 text-xs font-medium mt-1">(${statusLabel}: ${incomeDetails})</p>
                    </div>
                    <div class="p-6 space-y-4 flex-grow">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                            <span class="text-gray-500 font-bold">إجمالي الوحدات</span>
                            <div class="text-left">
                                <div class="font-black text-xl brand-blue" dir="ltr">${formatNumber(totalCells)} <span class="text-xs text-gray-500">وحدة</span></div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                            <span class="text-gray-500 font-bold">المساحة المتاحة (م²)</span>
                            <span class="font-black text-gray-800 text-lg" dir="ltr">${formatRange(item["أقل_مساحة"], item["أكبر_مساحة"])}</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                            <span class="text-gray-500 font-bold">متوسط سعر الوحدة</span>
                            <span class="font-black text-gray-800 text-xl" dir="ltr">${formatRange(item["أقل_سعر"], item["أكبر_سعر"])} <span class="text-xs font-medium">ج.م</span></span>
                        </div>
                        <div class="flex justify-between items-center pb-2">
                            <span class="text-gray-500 font-bold text-lg">مقدم جدية الحجز</span>
                            <span class="font-black text-red-600 text-xl" dir="ltr">${formatNumber(item["جديه الحجز"])} <span class="text-xs font-bold">ج.م</span></span>
                        </div>
                    </div>
                    <!-- زر الواتساب (CTA) -->
                    <div class="p-5 border-t border-gray-100 bg-white">
                        <a href="${waLink}" target="_blank" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl flex justify-center items-center gap-2 transition shadow-md">
                            تواصل معنا لتجهيز أوراق التقديم
                        </a>
                    </div>
                </div>`;
                container.innerHTML += card;
            });
        }
    </script>
</body>
</html>
